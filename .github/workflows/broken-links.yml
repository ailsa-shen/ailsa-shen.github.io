name: Check for broken links

on:
  push:
    branches:
      - master
      - main
    paths:
      - "site/**"
      - "assets/**"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "site/**"
      - "assets/**"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    # only run on the main repo
    if: github.repository == 'alshedivat/al-folio'
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          fail: true
          # removed md files that include liquid tags
          args: --user-agent 'curl/7.54' --exclude-path site/pages/404.md --verbose --no-progress './site/**/*.md' './site/**/*.html'
